[theme]
base = "dark"
primaryColor = "#1FA8FF"
backgroundColor = "#060B16"
secondaryBackgroundColor = "#0D1626"
textColor = "#E6EEF8"
borderColor = "#1C2A40"
dataframeBorderColor = "#1C2A40"
dataframeHeaderBackgroundColor = "#0F1B2E"
linkColor = "#5CC2FF"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "sans-serif"
headingFont = "Saira Semi Condensed:https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontWeight = 700
orangeColor = "#FF8C1A"
blueColor = "#1FA8FF"
greenColor = "#2FBF7A"
redColor = "#F0566B"
chartCategoricalColors = ["#2A9F63", "#4B74F0", "#0EA5A5", "#CF7313", "#A07BDB", "#E5466A"]

[runner]
# Não exibir na tela valores soltos do código (evita "telas de código")
magicEnabled = false

[client]
toolbarMode = "minimal"
